<script>

    document.addEventListener('DOMContentLoaded', function () {
      const { GUIDE_SECTIONS } = window.CatData;
      const { escapeHtml } = window.CatUI;

      document.getElementById('guide-grid').innerHTML = GUIDE_SECTIONS.map(function (sec) {

          '<h2 style="font-size:1.25rem">' + sec.icon + ' ' + escapeHtml(sec.title) + '</h2>' +
          '<ul style="padding-left:1.2rem;margin:0">' +
            sec.items.map(function (item) {
              return '<li style="margin-bottom:.5rem">' + escapeHtml(item) + '</li>';
            }).join('') +
          '</ul>' +
        '</article>';
      }).join('');
    });
  })();
